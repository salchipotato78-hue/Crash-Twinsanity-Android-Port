# Android engine, milestone 1: builds libcrashtwin_engine.so from the game's sources and the split. Manual only; the APK
# workflow (android.yml) is unchanged and keeps building the app without the engine.
name: Android engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: libcrashtwin_engine.so (arm64)
    runs-on: ubuntu-latest
    env:
      GAME_DATA_TOKEN: ${{ secrets.GAME_DATA_TOKEN }}
      GAME_DATA_REPO: ${{ vars.GAME_DATA_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse the game's files
        run: python3 native/tools/check_game_data.py

      - name: Fetch the game split from the private repo
        if: env.GAME_DATA_TOKEN != '' && env.GAME_DATA_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GAME_DATA_REPO }}
          token: ${{ secrets.GAME_DATA_TOKEN }}
          path: build-input
          persist-credentials: false

      - name: Install the PS2 toolchain and clang 20
        run: |
          curl -fL --retry 3 -o /tmp/ps2dev.tar.gz https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xzf /tmp/ps2dev.tar.gz -C /usr/local
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 ninja-build

      - name: Copy the split into the tree (this run only)
        run: |
          src=build-input
          if [ ! -e build-input/SLES_525.68 ]; then
            found=$(find build-input -maxdepth 2 -name SLES_525.68 | head -1)
            if [ -z "$found" ]; then echo "SLES_525.68 is not in the private repo"; ls -la build-input; exit 1; fi
            src=$(dirname "$found")
          fi
          tar -C "$src" --exclude=.git -cf - . | tar -C . -xf -

      - name: Generate the game's data (data.cpp)
        env:
          TWIN_CLANG: clang++-20
        run: |
          python3 native/tools/data_types.py
          python3 native/tools/convert_data.py
          ls -la build/native/data.cpp

      - name: Install the NDK r28c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build libcrashtwin_engine.so (arm64)
        run: |
          cmake -S android/engine -B build/engine-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCRASHTWIN_ROOT="$GITHUB_WORKSPACE" -DCRASHTWIN_PYTHON=python3 -DCRASHTWIN_HOST_CLANG=clang++-20 \
            -DCRASHTWIN_OUT="$GITHUB_WORKSPACE/build/engine-out" \
          | tee build-engine-configure.log
          # -k 0: keep going past failures, so one log shows every error
          cmake --build build/engine-android -j"$(nproc)" -- -k 0 2>&1 | tee build-engine.log

      - name: Upload the library and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashtwin-engine-arm64
          path: |
            build/engine-out/*.so
            build-engine*.log
          if-no-files-found: warn
