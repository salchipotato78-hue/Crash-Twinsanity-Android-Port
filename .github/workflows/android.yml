# Android: one job, run by hand (Actions > Android > Run workflow).
# It refuses the game's files, downloads the game split from the GAME_DATA_URL secret if it's set, and builds the APK.
name: Android

on:
  workflow_dispatch:
    inputs:
      build:
        description: Debug or release APK
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      GAME_DATA_URL: ${{ secrets.GAME_DATA_URL }}
      GAME_DATA_SHA256: ${{ vars.GAME_DATA_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse the game's files
        run: python3 native/tools/check_game_data.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Download the game split (secret GAME_DATA_URL, if set)
        if: env.GAME_DATA_URL != ''
        run: bash tools/fetch_game_data.sh

      # ubuntu-latest already has the Android SDK in ANDROID_HOME (no setup-android step: it fails on the runner's sdkmanager)
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon ":app:assemble${{ inputs.build == 'release' && 'Release' || 'Debug' }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashTwinsanity-${{ inputs.build }}
          path: android/app/build/outputs/apk/${{ inputs.build }}/*.apk
