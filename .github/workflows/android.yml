# Android APK (manual). Builds the app and the native library with the NDK. The engine itself is not linked yet
# (android/README.md, hito 0). Nothing from the disc goes in: the disc is read on the device.
name: Android

on:
  workflow_dispatch:
    inputs:
      build:
        description: Debug or release APK
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse disc images in the tree
        run: |
          if find . -path ./.git -prune -o \( -iname '*.iso' -o -iname '*.bin' -o -iname '*.img' -o -iname '*.cue' \) -print | grep -q .; then
            echo "A disc image is in the tree:"; find . -path ./.git -prune -o \( -iname '*.iso' -o -iname '*.bin' -o -iname '*.img' -o -iname '*.cue' \) -print; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test the disc reader (host build)
        run: |
          g++ -std=c++17 -Wall -Wextra android/native/test/test_iso9660.cpp android/native/src/iso9660.cpp -o /tmp/test_iso9660
          /tmp/test_iso9660

      - name: Install the NDK r28c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build libtwinsanityevolved.so (arm64)
        run: |
          cmake -S android/native -B build/native-android \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
            -DCRASHTWIN_OUT="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          cmake --build build/native-android --config Release
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon ":app:assemble${{ inputs.build == 'release' && 'Release' || 'Debug' }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashTwinsanity-${{ inputs.build }}
          path: android/app/build/outputs/apk/${{ inputs.build }}/*.apk
