# Android APK (manual). Builds FFmpeg (LGPL, arm64), the app and the native library with the NDK. The engine itself is
# not linked yet (android/README.md, hito 0). Nothing from the disc goes in: the disc is read on the device.
name: Android

on:
  workflow_dispatch:
    inputs:
      build:
        description: Debug or release APK
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse disc images in the tree
        # .iso, .img and .cue are always discs. A .bin is a disc only when it is big: the repo's own test tables
        # (engine/tests/oracle/og_tables.bin, a few KB) are kept.
        run: |
          bad=$(find . -path ./.git -prune -o \( -iname '*.iso' -o -iname '*.img' -o -iname '*.cue' \) -print)
          bad="$bad$(find . -path ./.git -prune -o -iname '*.bin' -size +16M -print)"
          if [ -n "$(echo "$bad" | tr -d '[:space:]')" ]; then
            echo "A disc image is in the tree:"; echo "$bad"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test the disc reader (host build)
        run: |
          g++ -std=c++17 -Wall -Wextra android/native/test/test_iso9660.cpp android/native/src/iso9660.cpp -o /tmp/test_iso9660
          /tmp/test_iso9660

      - name: Fetch SDL 2.32.10 (the native library and SDLActivity's Java)
        run: |
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git build-sdl
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp build-sdl/android-project/app/src/main/java/org/libsdl/app/*.java android/app/src/main/java/org/libsdl/app/
          ls android/app/src/main/java/org/libsdl/app/

      - name: Install the NDK r28c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Install ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build

      - name: Fetch the pinned toolchain (wasi-sdk 24.0, wabt 1.0.42)
        run: bash tools/fetch_toolchain.sh

      - name: Build tegame for arm64 (the game's library)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DTE_ANDROID_GAME_ONLY=ON
          cmake --build build-android --target tegame

      - name: Build FFmpeg for arm64 (the movies' MPEG-2 decoder)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bash tools/android/ffmpeg_android.sh "$GITHUB_WORKSPACE/ffmpeg-android" 2>&1 | tee ffmpeg-android.log

      - name: Build libtwinsanityevolved.so (arm64)
        run: |
          cmake -S android/native -B build/native-android \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
            -DCRASHTWIN_SDL_SRC="$GITHUB_WORKSPACE/build-sdl" \
            -DCRASHTWIN_FFMPEG_DIR="$GITHUB_WORKSPACE/ffmpeg-android" \
            -DCRASHTWIN_TEGAME_LIB="$GITHUB_WORKSPACE/build-android/libtegame.a" \
            -DCRASHTWIN_OUT="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          cmake --build build/native-android --config Release
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon ":app:assemble${{ inputs.build == 'release' && 'Release' || 'Debug' }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashTwinsanity-${{ inputs.build }}
          path: android/app/build/outputs/apk/${{ inputs.build }}/*.apk
