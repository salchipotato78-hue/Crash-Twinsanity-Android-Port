# Android: one job, run by hand (Actions > Android > Run workflow).
# It refuses the game's files, fetches the game split from the private repo (GAME_DATA_REPO + GAME_DATA_TOKEN) if set, and builds the APK.
name: Android

on:
  workflow_dispatch:
    inputs:
      build:
        description: Debug or release APK
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      GAME_DATA_TOKEN: ${{ secrets.GAME_DATA_TOKEN }}
      GAME_DATA_REPO: ${{ vars.GAME_DATA_REPO }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse the game's files
        run: python3 native/tools/check_game_data.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test the disc reader (host build, no Android)
        run: |
          g++ -std=c++17 -Wall -Wextra android/native/test/test_iso9660.cpp android/native/src/iso9660.cpp -o /tmp/test_iso9660
          /tmp/test_iso9660

      - name: Build the native library (libcrashtwin.so, arm64) with the NDK
        run: |
          cmake -S android/native -B build/native-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
            -DCRASHTWIN_OUT="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          cmake --build build/native-android --config Release
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Get the game split from the private repo (if GAME_DATA_TOKEN is set)
        if: env.GAME_DATA_TOKEN != '' && env.GAME_DATA_REPO != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_DATA_REPO }}
          token: ${{ secrets.GAME_DATA_TOKEN }}
          path: build-input
          persist-credentials: false

      # ubuntu-latest already has the Android SDK in ANDROID_HOME (no setup-android step: it fails on the runner's sdkmanager)
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon ":app:assemble${{ inputs.build == 'release' && 'Release' || 'Debug' }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashTwinsanity-${{ inputs.build }}
          path: android/app/build/outputs/apk/${{ inputs.build }}/*.apk
