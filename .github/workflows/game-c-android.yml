# The game's library (tegame) cross-compiled for arm64 Android with the NDK. Manual only.
# The wasm2c output is made on the host by the pinned wasi-sdk (tools/fetch_toolchain.sh); only tegame is built for
# Android (TE_ANDROID_GAME_ONLY=ON: the engine, SDL2 and FFmpeg are host programs and are skipped).
name: Game C (Android)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-c-android:
    name: tegame (arm64 Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build

      - name: Fetch the pinned toolchain (wasi-sdk 24.0, wabt 1.0.42)
        run: bash tools/fetch_toolchain.sh

      - name: Install the NDK r28c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure tegame for arm64 Android
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DTE_ANDROID_GAME_ONLY=ON 2>&1 | tee configure-android.log

      - name: Build tegame for arm64
        run: cmake --build build-android --target tegame -- -k 0 2>&1 | tee build-tegame-android.log

      - name: Upload the library and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tegame-arm64-android
          path: |
            build-android/libtegame.a
            build-android/*.log
            configure-android.log
            build-tegame-android.log
          if-no-files-found: warn
