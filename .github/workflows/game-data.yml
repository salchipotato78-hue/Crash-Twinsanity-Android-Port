# Refuses the game's files (its executable, data, disc images, texture packs): native/tools/check_game_data.py says which and why.
# Manual only: Actions > No game files > Run workflow.
name: No game files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 native/tools/check_game_data.py
